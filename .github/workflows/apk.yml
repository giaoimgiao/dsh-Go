name: apk
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: deps
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile || flutter pub get
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - name: build apk
        working-directory: app
        run: |
          flutter build apk --release --flavor arm64 --target-platform android-arm64
          ls -la build/app/outputs/flutter-apk/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: dsh-go kali ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/*.apk
